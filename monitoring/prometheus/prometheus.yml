global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'spring-boot'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['jipsamoye-app-blue:8080', 'jipsamoye-app-green:8080']
        labels:
          application: 'jipsamoye-backend'
