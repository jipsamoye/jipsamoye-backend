# 성능 측정 전용 MySQL (기존 개발 DB와 완전 분리)
# 사용법:
#   docker compose -f docker-compose.loadtest.yml up -d
#   포트 3307 로 접속 (root / loadtest)
#
# 주의: 이 파일은 성능 측정용 더미 데이터 적재 전용이다.
#       기존 docker-compose.yml 의 db 서비스(jipsamoye-db / mysql-data)와는
#       컨테이너명·볼륨명·포트가 모두 달라 충돌하지 않는다.
services:
  db-loadtest:
    image: mysql:8.0
    container_name: jipsamoye-db-loadtest
    environment:
      MYSQL_ROOT_PASSWORD: loadtest
      MYSQL_DATABASE: jipsamoye_loadtest
    ports:
      - "3307:3306"
    volumes:
      - mysql-loadtest-data:/var/lib/mysql
    command:
      # prod(EC2 t2.micro Docker MySQL) 기본값 근사
      - "--innodb-buffer-pool-size=128M"
      # LOAD DATA LOCAL INFILE 활성화
      - "--local-infile=1"
      # 서버측 파일 임포트 제약 해제 (LOCAL INFILE 사용 시에도 명시)
      - "--secure-file-priv="
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ploadtest"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-loadtest-data:
